<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How AI Job Search OS works</title>
  <desc id="desc">Two-phase diagram: one-time setup followed by the daily loop with AI discovery, user links, verification, fit review, human decision, tracking, recruiter enrichment, and approved context updates.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}.phase{fill:#f6f8fb;stroke:#dce3ea;stroke-width:2}.card{fill:#ffffff;stroke:#cfd9e4;stroke-width:2}.ai{fill:#edf4fb;stroke:#8bb2dc;stroke-width:2}.human{fill:#17324d;stroke:#17324d;stroke-width:2}.state{fill:#f2f4f7;stroke:#aebbc9;stroke-width:2}.apply{fill:#eef8f1;stroke:#93c8a1;stroke-width:2}.hold{fill:#fff8e8;stroke:#dfc27b;stroke-width:2}.drop{fill:#fff0f0;stroke:#dba0a0;stroke-width:2}.line{fill:none;stroke:#7c8da1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#9aa8b8;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}.title{font:700 30px system-ui,-apple-system,Segoe UI,sans-serif;fill:#142033}.subtitle{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#66758a}.phaseTitle{font:800 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.6px;fill:#1f5ea8}.label{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#142033;text-anchor:middle}.small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#58667a;text-anchor:middle}.humanText{font:800 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff;text-anchor:middle}.humanSmall{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#dbe7f2;text-anchor:middle}.badge{font:800 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1f5ea8}.legend{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#58667a}.decision{font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;text-anchor:middle}.note{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#46566b;text-anchor:middle}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8da1"/></marker>
  </defs>

  <rect class="bg" width="1200" height="820" rx="26"/>
  <text class="title" x="60" y="58">How it works: set up once, use it every day</text>
  <text class="subtitle" x="60" y="84">AI handles search, verification, memory, and tracking. The human keeps final judgment.</text>

  <circle cx="820" cy="62" r="7" fill="#8bb2dc"/><text class="legend" x="835" y="67">AI / system task</text>
  <circle cx="952" cy="62" r="7" fill="#17324d"/><text class="legend" x="967" y="67">human checkpoint</text>

  <rect class="phase" x="45" y="115" width="1110" height="235" rx="24"/>
  <text class="phaseTitle" x="72" y="148">SET UP ONCE</text>

  <rect class="card" x="72" y="177" width="176" height="118" rx="16"/>
  <text class="badge" x="88" y="199">01</text>
  <text class="label" x="160" y="222"><tspan x="160">Download</tspan><tspan x="160" dy="20">starter pack</tspan></text>
  <text class="small" x="160" y="272">SYSTEM + tracker</text>
  <path class="line" d="M248 236 H280"/>

  <rect class="card" x="286" y="177" width="176" height="118" rx="16"/>
  <text class="badge" x="302" y="199">02</text>
  <text class="label" x="374" y="222"><tspan x="374">Upload to</tspan><tspan x="374" dy="20">AI Project</tspan></text>
  <text class="small" x="374" y="264">+ sanitized CV</text>
  <path class="line" d="M462 236 H494"/>

  <rect class="ai" x="500" y="177" width="176" height="118" rx="16"/>
  <text class="badge" x="516" y="199">03</text>
  <text class="label" x="588" y="222"><tspan x="588">AI reads CV</tspan><tspan x="588" dy="20">+ interviews you</tspan></text>
  <text class="small" x="588" y="272">direction & preferences</text>
  <path class="line" d="M676 236 H708"/>

  <rect class="human" x="714" y="177" width="176" height="118" rx="16"/>
  <text x="730" y="199" style="font:800 12px system-ui;fill:#9bc6f7">04 · HUMAN</text>
  <text class="humanText" x="802" y="226"><tspan x="802">Review &</tspan><tspan x="802" dy="20">approve</tspan></text>
  <text class="humanSmall" x="802" y="272">correct anything wrong</text>
  <path class="line" d="M890 236 H922"/>

  <rect class="state" x="928" y="177" width="198" height="118" rx="16"/>
  <text class="badge" x="944" y="199">05</text>
  <text class="label" x="1027" y="222"><tspan x="1027">Upload</tspan><tspan x="1027" dy="20">USER_CONTEXT.md</tspan></text>
  <text class="small" x="1027" y="272">project initialized</text>

  <rect x="484" y="318" width="232" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="344" style="font:800 13px system-ui;letter-spacing:1.3px;fill:#fff;text-anchor:middle">ACTIVE MODE</text>

  <rect class="phase" x="45" y="388" width="1110" height="382" rx="24"/>
  <text class="phaseTitle" x="72" y="421">DAILY LOOP</text>

  <text class="small" x="170" y="449">Enter through either path</text>
  <rect class="ai" x="72" y="466" width="196" height="78" rx="15"/>
  <text class="label" x="170" y="495">AI finds jobs</text>
  <text class="small" x="170" y="520">automatic discovery</text>

  <rect class="card" x="72" y="566" width="196" height="78" rx="15"/>
  <text class="label" x="170" y="595">You paste a link</text>
  <text class="small" x="170" y="620">LinkedIn / careers / etc.</text>

  <path class="line" d="M268 505 H320 V548 H352"/>
  <path class="line" d="M268 605 H320 V548"/>

  <rect class="ai" x="358" y="499" width="170" height="98" rx="15"/>
  <text class="label" x="443" y="532"><tspan x="443">Verify live +</tspan><tspan x="443" dy="20">official source</tspan></text>
  <text class="small" x="443" y="578">stale → find alternatives</text>
  <path class="line" d="M528 548 H560"/>

  <rect class="ai" x="566" y="499" width="160" height="98" rx="15"/>
  <text class="label" x="646" y="532">Review fit</text>
  <text class="small" x="646" y="558"><tspan x="646">evidence, gaps,</tspan><tspan x="646" dy="18">score & verdict</tspan></text>
  <path class="line" d="M726 548 H758"/>

  <rect class="human" x="764" y="489" width="170" height="118" rx="17"/>
  <text x="849" y="520" style="font:800 12px system-ui;fill:#9bc6f7;text-anchor:middle">HUMAN CHECKPOINT</text>
  <text class="humanText" x="849" y="551">YOU DECIDE</text>
  <text class="humanSmall" x="849" y="577">APPLY / HOLD / DROP</text>

  <path class="line" d="M849 607 V638 H785 V657"/>
  <path class="line" d="M849 607 V657"/>
  <path class="line" d="M849 607 V638 H1010 V657"/>

  <rect class="apply" x="718" y="662" width="132" height="58" rx="14"/>
  <text class="decision" x="784" y="697" fill="#356947">APPLY</text>
  <rect class="hold" x="866" y="662" width="132" height="58" rx="14"/>
  <text class="decision" x="932" y="697" fill="#7c6226">HOLD</text>
  <rect class="drop" x="1014" y="662" width="112" height="58" rx="14"/>
  <text class="decision" x="1070" y="697" fill="#8c4545">DROP</text>

  <rect class="state" x="358" y="642" width="284" height="92" rx="16"/>
  <text class="label" x="500" y="675">JOB_TRACKER.xlsx</text>
  <text class="small" x="500" y="700"><tspan x="500">status · contacts · activity</tspan><tspan x="500" dy="18">dashboard</tspan></text>
  <path class="line" d="M718 691 H650"/>
  <path class="dash" d="M866 691 H650"/>
  <path class="line" d="M1014 691 H650"/>

  <rect class="ai" x="72" y="676" width="234" height="58" rx="14"/>
  <text class="label" x="189" y="701">Recruiter / hiring user</text>
  <text class="small" x="189" y="721">automatic for viable roles</text>
  <path class="line" d="M358 688 H312"/>

  <path class="dash" d="M500 734 V750 H1028 V744"/>
  <text class="note" x="760" y="758">Durable preference changed? AI proposes update → you approve → new USER_CONTEXT version</text>
</svg>